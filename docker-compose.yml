name: versa-cpe-manager

services:
  # ─── REVERSE PROXY (TLS termination) ──────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend-net
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # ─── FRONTEND (React + Ant Design) ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=https://localhost/api/v1
      - VITE_KEYCLOAK_URL=https://localhost/auth
      - VITE_KEYCLOAK_REALM=versa-telecom
      - VITE_KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
    networks:
      - frontend-net
    depends_on:
      - backend
    restart: unless-stopped

  # ─── BACKEND (FastAPI) ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - KEYCLOAK_URL=http://keycloak:8080
      - KEYCLOAK_REALM=versa-telecom
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_STORE_TYPE=${SECRET_STORE_TYPE:-mock_vault}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - postgres
      - redis
      - keycloak
    restart: unless-stopped

  # ─── KEYCLOAK (Identity Provider / LDAP federation) ───────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=${KC_DB_USER}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
    volumes:
      - ./keycloak/realm-config:/opt/keycloak/data/import:ro
    networks:
      - backend-net
      - ldap-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── POSTGRESQL (app + Keycloak databases) ────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - APP_DB_USER=${DB_USER}
      - APP_DB_PASSWORD=${DB_PASSWORD}
      - APP_DB_NAME=${DB_NAME}
      - KC_DB_USER=${KC_DB_USER}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net
    restart: unless-stopped

  # ─── REDIS (caching / rate-limit state) ───────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    restart: unless-stopped

  # ─── MOCK LDAP (development-only) ─────────────────────────
  # Active in dev (`docker compose --profile dev up`). Points Keycloak
  # at a local OpenLDAP so RBAC/login works before corporate AD is wired.
  openldap:
    image: osixia/openldap:1.5.0
    profiles: ["dev"]
    environment:
      - LDAP_ORGANISATION=Versa Telecom Dev
      - LDAP_DOMAIN=versa-dev.local
      - LDAP_ADMIN_PASSWORD=admin
      - LDAP_READONLY_USER=true
      - LDAP_READONLY_USER_PASSWORD=readonly
    volumes:
      - ./keycloak/ldap-config:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    networks:
      - ldap-net
    restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true
  ldap-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data: