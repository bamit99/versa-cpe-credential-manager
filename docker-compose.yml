name: versa-cpe-manager

services:
  # ─── REVERSE PROXY (TLS termination) ──────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - frontend
      - backend
      - keycloak
    restart: unless-stopped

  # ─── FRONTEND (React + Ant Design) ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=https://localhost:${NGINX_HTTPS_PORT:-443}/api/v1
        - VITE_KEYCLOAK_URL=https://localhost:${NGINX_HTTPS_PORT:-443}/auth
        - VITE_KEYCLOAK_REALM=versa-telecom
        - VITE_KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
    networks:
      - frontend-net
    depends_on:
      - backend
    restart: unless-stopped

  # ─── BACKEND (FastAPI) ────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - KEYCLOAK_URL=http://keycloak:8080/auth
      - KEYCLOAK_PUBLIC_URL=https://localhost:${NGINX_HTTPS_PORT:-443}/auth
      - KEYCLOAK_REALM=versa-telecom
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET}
      - KEYCLOAK_ADMIN_CLIENT_ID=${KEYCLOAK_ADMIN_CLIENT_ID:-versa-cpe-admin}
      - KEYCLOAK_ADMIN_CLIENT_SECRET=${KC_ADMIN_CLIENT_SECRET}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_STORE_TYPE=${SECRET_STORE_TYPE:-mock_vault}
    networks:
      - frontend-net
      - backend-net
    depends_on:
      - postgres
      - redis
      - keycloak
    restart: unless-stopped

  # ─── KEYCLOAK (Identity Provider / LDAP federation) ───────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    entrypoint:
      - /bin/sh
      - -c
      - "/opt/keycloak/bin/kc.sh import --dir=/opt/keycloak/data/import --override=false; exec /opt/keycloak/bin/kc.sh start-dev"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=${KC_ADMIN_USERNAME}
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KC_ADMIN_PASSWORD}
      - KC_ADMIN_CLIENT_SECRET=${KC_ADMIN_CLIENT_SECRET}
      - KC_DEMO_ADMIN_PASSWORD=${KC_DEMO_ADMIN_PASSWORD}
      - KC_DEMO_OPS_PASSWORD=${KC_DEMO_OPS_PASSWORD}
      - KC_DEMO_FIELD_PASSWORD=${KC_DEMO_FIELD_PASSWORD}
      - JAVA_OPTS_APPEND=-Dkeycloak.migration.replace-placeholders=true
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/keycloak
      - KC_DB_USERNAME=${KC_DB_USER}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_PROXY_HEADERS=xforwarded
      - KC_HOSTNAME=https://localhost:${NGINX_HTTPS_PORT:-443}/auth
      - KC_HTTP_RELATIVE_PATH=/auth
      - KC_HOSTNAME_STRICT=false
    volumes:
      - ./keycloak/realm-config:/opt/keycloak/data/import:ro
    networks:
      - backend-net
      - ldap-net
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ─── POSTGRESQL (app + Keycloak databases) ────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - APP_DB_USER=${DB_USER}
      - APP_DB_PASSWORD=${DB_PASSWORD}
      - APP_DB_NAME=${DB_NAME}
      - KC_DB_USER=${KC_DB_USER}
      - KC_DB_PASSWORD=${KC_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend-net
    restart: unless-stopped

  # ─── REDIS (caching / rate-limit state) ───────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - backend-net
    restart: unless-stopped

  # ─── MOCK LDAP (development-only) ─────────────────────────
  # DISABLED: osixia/openldap:1.5.0 fails to boot on this box (its generated
  # tls/replication/admin LDIF templates are missing from the image layers,
  # regardless of LDAP_TLS). No service depends on it today — the Keycloak
  # realm has empty userFederationProviders, so the app runs fine without it.
  # Re-enable when the AD/LDAP federation feature is actually wired (Phase 3/4).
  # openldap:
  #   image: osixia/openldap:1.5.0
  #   profiles: ["dev"]
  #   environment:
  #     - LDAP_ORGANISATION=Versa Telecom Dev
  #     - LDAP_DOMAIN=versa-dev.local
  #     - LDAP_ADMIN_PASSWORD=admin
  #     - LDAP_READONLY_USER=true
  #     - LDAP_READONLY_USER_PASSWORD=readonly
  #   volumes:
  #     - ./keycloak/ldap-config:/container/service/slapd/assets/config/bootstrap/ldif/custom
  #   networks:
  #     - ldap-net
  #   restart: unless-stopped

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true
  ldap-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data: