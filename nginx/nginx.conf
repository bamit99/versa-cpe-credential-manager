worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    server_tokens off;

    # Rate limiting zones
    limit_req_zone  $binary_remote_addr  zone=api:10m   rate=20r/s;
    # No blanket /auth limit: Keycloak legitimately serves many requests during a
    # login (page assets, 3p-cookies checks, login-status iframe polling) — a low
    # per-minute cap on /auth/ 503s those and breaks the login/session flow. We
    # throttle only the credential-verifying endpoints (below); Keycloak's own
    # realm brute-force detection is the password-attack backstop.
    limit_req_zone  $binary_remote_addr  zone=auth:10m  rate=30r/m;

    # Upstreams
    upstream frontend  { server frontend:3000; }
    upstream backend   { server backend:8000; }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ─── HTTP → HTTPS redirect ────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ─── HTTPS (TLS termination) ──────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/versa-cpe.crt;
        ssl_certificate_key /etc/nginx/certs/versa-cpe.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!3DES;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://localhost http://localhost:*" always;

        # ─── Frontend (SPA) ───────────────────────────────────
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── Backend API ──────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── Keycloak ─────────────────────────────────────────
        # Only password-submit + token endpoints are rate-limited (regex
        # locations win over the /auth/ prefix below). Keycloak's realm
        # brute-force detection handles repeat password guessing.
        location ~* ^/auth/realms/[^/]+/(login-actions/authenticate|protocol/openid-connect/token)$ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://keycloak:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass http://keycloak:8080;   # NOTE: no trailing slash — Keycloak serves /auth
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── Health ───────────────────────────────────────────
        location = /health {
            proxy_pass http://backend/health;
        }

        # Reject requests for dotfiles / vendor dirs, but allow Keycloak's
        # required /.well-known/ OIDC metadata endpoint.
        location ~ /\.(?!well-known/).* { deny all; }
    }
}